name: build-caddy-l4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        target:
          - name: linux-amd64
            goarch: amd64
          - name: linux-arm64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=$(git ls-remote --tags --refs --sort='v:refname' https://github.com/caddyserver/caddy.git | tail -n1 | awk -F/ '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file tar

      - name: Show Go version
        run: |
          go version

      - name: Verify custom entrypoint
        shell: bash
        run: |
          set -euo pipefail
          test -f cmd/caddy-l4/main.go
          echo "===== cmd/caddy-l4/main.go ====="
          cat cmd/caddy-l4/main.go

      - name: Init module and fetch deps
        shell: bash
        run: |
          set -euo pipefail
          cd cmd/caddy-l4

          rm -f go.mod go.sum
          go mod init caddy-l4-build
          go get github.com/caddyserver/caddy/v2@${{ steps.meta.outputs.tag }}
          go get github.com/mholt/caddy-l4@latest
          go mod tidy

          echo "===== go.mod ====="
          cat go.mod
          echo "===== go.sum (head) ====="
          sed -n '1,80p' go.sum

      - name: Build
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          mkdir -p dist/pkg

          if [ "${GOARCH}" = "amd64" ]; then
            export GOAMD64=v3
          fi

          BIN="caddy-l4"
          OUT="${GITHUB_WORKSPACE}/dist/${BIN}"

          cd cmd/caddy-l4
          go build \
            -trimpath \
            -ldflags="-s -w -buildid=" \
            -o "${OUT}" \
            .

          cd "${GITHUB_WORKSPACE}"
          chmod +x "${OUT}"

          file "${OUT}"
          ls -lh "${OUT}"

      - name: Verify modules
        shell: bash
        run: |
          set -euo pipefail
          ./dist/caddy-l4 list-modules | tee dist/modules.txt
          grep '^caddy.logging\.' dist/modules.txt
          grep '^layer4\.' dist/modules.txt

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          cp dist/caddy-l4 dist/pkg/caddy-l4

          tar -C dist/pkg -czf \
            "dist/caddy-l4-${{ matrix.target.name }}-${{ steps.meta.outputs.tag }}.tar.gz" \
            caddy-l4

          ls -lh "dist/caddy-l4-${{ matrix.target.name }}-${{ steps.meta.outputs.tag }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-l4-${{ matrix.target.name }}
          path: dist/caddy-l4-${{ matrix.target.name }}-${{ steps.meta.outputs.tag }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Generate metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "tag=$(git ls-remote --tags --refs --sort='v:refname' https://github.com/caddyserver/caddy.git | tail -n1 | awk -F/ '{print $3}')" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: caddy-l4 ${{ steps.meta.outputs.tag }}
          overwrite_files: true
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
