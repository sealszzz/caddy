name: build-caddy-l4

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      caddy_tag: ${{ steps.meta.outputs.caddy_tag }}
      caddy_sha: ${{ steps.meta.outputs.caddy_sha }}
      l4_sha: ${{ steps.meta.outputs.l4_sha }}
      xcaddy_sha: ${{ steps.meta.outputs.xcaddy_sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      build_time: ${{ steps.meta.outputs.build_time }}
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        target:
          - name: linux-amd64
            goarch: amd64
          - name: linux-arm64
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          echo "caddy_tag=$(git ls-remote --tags --refs --sort='v:refname' https://github.com/caddyserver/caddy.git | tail -n1 | awk -F/ '{print $3}')" >> "$GITHUB_OUTPUT"
          echo "caddy_sha=$(git ls-remote https://github.com/caddyserver/caddy.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "l4_sha=$(git ls-remote https://github.com/mholt/caddy-l4.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "xcaddy_sha=$(git ls-remote https://github.com/caddyserver/xcaddy.git HEAD | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file tar

      - name: Install xcaddy
        shell: bash
        run: |
          set -euo pipefail
          GOBIN="${HOME}/go/bin" go install github.com/caddyserver/xcaddy/cmd/xcaddy@${{ steps.meta.outputs.xcaddy_sha }}
          echo "${HOME}/go/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        shell: bash
        run: |
          set -euo pipefail
          go version
          xcaddy version || true

      - name: Build
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail

          mkdir -p dist/pkg

          if [ "${GOARCH}" = "amd64" ]; then
            export GOAMD64=v3
          fi

          BIN="caddy-l4"
          OUT="dist/${BIN}"

          XCADDY_GO_BUILD_FLAGS="-trimpath -ldflags '-s -w -buildid='" \
          xcaddy build "${{ steps.meta.outputs.caddy_sha }}" \
            --with "github.com/mholt/caddy-l4@${{ steps.meta.outputs.l4_sha }}" \
            --output "${OUT}"

          chmod +x "${OUT}"

          file "${OUT}"
          ls -lh "${OUT}"

      - name: Verify runtime (amd64 only)
        if: matrix.target.goarch == 'amd64'
        shell: bash
        run: |
          set -euo pipefail
          ./dist/caddy-l4 version
          ./dist/caddy-l4 list-modules | tee dist/modules.txt
          grep '^layer4\.' dist/modules.txt

      - name: Verify binary format (arm64 only)
        if: matrix.target.goarch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          file ./dist/caddy-l4 | tee dist/file.txt
          grep -E 'aarch64|ARM aarch64' dist/file.txt

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          cp dist/caddy-l4 dist/pkg/caddy-l4

          tar -C dist/pkg -czf \
            "dist/caddy-l4-${{ matrix.target.name }}-${{ steps.meta.outputs.caddy_tag }}-${{ steps.meta.outputs.short_sha }}.tar.gz" \
            caddy-l4

          ls -lh "dist/caddy-l4-${{ matrix.target.name }}-${{ steps.meta.outputs.caddy_tag }}-${{ steps.meta.outputs.short_sha }}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: caddy-l4-${{ matrix.target.name }}-${{ steps.meta.outputs.short_sha }}
          path: dist/caddy-l4-${{ matrix.target.name }}-${{ steps.meta.outputs.caddy_tag }}-${{ steps.meta.outputs.short_sha }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.caddy_tag }}
          name: caddy-l4 ${{ needs.build.outputs.caddy_tag }}
          overwrite_files: true
          files: dist/*.tar.gz
          body: |
            Caddy: ${{ needs.build.outputs.caddy_tag }}
            caddy: ${{ needs.build.outputs.caddy_sha }}
            caddy-l4: ${{ needs.build.outputs.l4_sha }}
            xcaddy: ${{ needs.build.outputs.xcaddy_sha }}
            repo short sha: ${{ needs.build.outputs.short_sha }}
            build time: ${{ needs.build.outputs.build_time }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
